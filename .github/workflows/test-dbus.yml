name: Test dbus Service with Virsh QCOW2

on:
  workflow_dispatch:
    inputs:
      filesystem:
        description: Filesystem type
        required: true
        default: xfs
        type: choice
        options: [btrfs, xfs]
  push:
    branches: ["**"]

env:
  QCOW_IMAGE: void-build.qcow2
  VM_NAME: void-test-build
  QEMU_ARCH: aarch64

jobs:
  dbus-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      # ------------------------------------------------------------------
      # Checkout repo
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Install QEMU, libvirt and the *qemu‑nbd* binary
      # ------------------------------------------------------------------
      - name: Install QEMU & libvirt tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-utils \          # provides qemu-nbd
            qemu-system-arm \
            qemu-system-x86 \
            qemu-system-common \ # ensures qemu-nbd on newer Ubuntu releases
            libvirt-daemon-system libvirt-clients virtinst \
            xfsprogs btrfs-progs parted util-linux

      # ------------------------------------------------------------------
      # Start libvirtd (required for later virsh steps)
      # ------------------------------------------------------------------
      - name: Start libvirtd
        run: |
          sudo systemctl start libvirtd
          sudo virsh list --all || true

      # ------------------------------------------------------------------
      # Create a pre‑allocated 20 GiB QCOW2 image
      # ------------------------------------------------------------------
      - name: Create QCOW2 image
        run: |
          mkdir -p /tmp/vm-storage
          cd /tmp/vm-storage
          qemu-img create -f qcow2 -o preallocation=full ${QCOW_IMAGE} 20G
          qemu-img info ${QCOW_IMAGE}

      # ------------------------------------------------------------------
      # Attach the image via NBD (avoids loop‑device size issues)
      # ------------------------------------------------------------------
      - name: Attach QCOW2 with NBD
        run: |
          cd /tmp/vm-storage
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 ${QCOW_IMAGE}
          # wait for partitions to appear
          for i in {1..10}; do
            [ -e /dev/nbd0p1 ] && [ -e /dev/nbd0p2 ] && break
            sleep 1
          done
          sudo parted -s /dev/nbd0 print

      # ------------------------------------------------------------------
      # Partition & format (EFI + root)
      # ------------------------------------------------------------------
      - name: Partition & format
        run: |
          sudo mkfs.vfat -n EFI /dev/nbd0p1
          if [ "${{ inputs.filesystem }}" = "btrfs" ]; then
            sudo mkfs.btrfs -f -L root /dev/nbd0p2
          else
            sudo mkfs.xfs -f -L root /dev/nbd0p2
          fi

      # ------------------------------------------------------------------
      # Mount and bootstrap a minimal Void Linux base
      # ------------------------------------------------------------------
      - name: Mount and bootstrap Void
        run: |
          sudo mkdir -p /tmp/mnt/root /tmp/mnt/efi
          sudo mount /dev/nbd0p2 /tmp/mnt/root
          sudo mount /dev/nbd0p1 /tmp/mnt/efi

          # Minimal pkgdb required by xbps‑install
          sudo touch /tmp/mnt/root/var/db/xbps/.pkgdb-0.plist

          # If the host already has xbps‑install, use it; otherwise skip (the later chroot step will install dbus directly)
          if command -v xbps-install >/dev/null; then
            sudo xbps-install -S -R https://repo-default.voidlinux.org/current \
              -r /tmp/mnt/root base-files base-system xbps
          fi

      # ------------------------------------------------------------------
      # Bind‑mount virtual filesystems for chroot
      # ------------------------------------------------------------------
      - name: Prepare chroot
        run: |
          MNT=/tmp/mnt/root
          for d in dev proc sys run; do
            sudo mount --rbind /$d $MNT/$d
            sudo mount --make-rslave $MNT/$d
          done
          sudo cp /etc/resolv.conf $MNT/etc/resolv.conf

      # ------------------------------------------------------------------
      # Install dbus and create a runit service inside the chroot
      # ------------------------------------------------------------------
      - name: Install & fix dbus in chroot
        run: |
          sudo chroot /tmp/mnt/root /bin/bash -c '
            export XBPS_ARCH=aarch64
            export REPO_URL="https://repo-default.voidlinux.org/current/aarch64"
            xbps-install -Sy dbus runit || exit 1

            # Create runit service for dbus
            mkdir -p /etc/sv/dbus
            cat > /etc/sv/dbus/run <<EOF
            #!/bin/sh
            exec 2>&1
            [ -d /var/run/dbus ] || mkdir -p /var/run/dbus
            exec chpst -u messagebus /usr/bin/dbus-daemon --nofork --system
            EOF
                        chmod +x /etc/sv/dbus/run
                        ln -sf /etc/sv/dbus /var/service/dbus
                      '

      # ------------------------------------------------------------------
      # Verify dbus works inside the chroot
      # ------------------------------------------------------------------
      - name: Verify dbus
        run: |
          sudo chroot /tmp/mnt/root /bin/bash -c '
            # start the service if the socket is missing
            if [ ! -S /var/run/dbus/system_bus_socket ]; then
              /etc/sv/dbus/run &
              sleep 2
            fi

            if [ -S /var/run/dbus/system_bus_socket ]; then
              echo "✅ dbus socket created"
            else
              echo "❌ dbus socket missing"
              exit 1
            fi

            command -v dbus-send && dbus-send --system --print-reply \
              /org/freedesktop/DBus /org/freedesktop/DBus.Introspectable.Introspect || true
          '

      # ------------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------------
      - name: Cleanup
        if: always()
        run: |
          sudo umount -R /tmp/mnt/root || true
          sudo qemu-nbd --disconnect /dev/nbd0 || true
